name: Shared model catalog
on:
  pull_request:
    paths: ['model-catalog/**', 'config/litellm.yaml', 'config/litellm_prod_catalog.json', 'clients/cli/src/commands/currentProdModels.ts', '.github/workflows/model-catalog.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv run model-catalog/generate.py --check
      - run: uv run model-catalog/test_catalog.py
